<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExcuusExpert - Snake</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="gamepad.png">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome Iconen -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090e;
      --card-bg: rgba(16, 18, 30, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(108, 99, 255, 0.6);
      --primary: #6c63ff;
      --primary-gradient: linear-gradient(135deg, #6c63ff 0%, #4f46e5 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Glow op de achtergrond */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.22) 0%, rgba(0,0,0,0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Header & Branding */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-group {
      display: flex;
      flex-direction: column;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-icon {
      font-size: 24px;
      color: #6c63ff;
      filter: drop-shadow(0 0 10px rgba(108, 99, 255, 0.5));
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }

    .btn-back {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      border-color: var(--border-hover);
      color: #ffffff;
    }

    /* Game Card */
    .game-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      background: rgba(10, 12, 22, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
    }

    .score-val { color: #818cf8; }
    .highscore-val { color: #00f2fe; }

    canvas {
      background: #0a0c16;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      max-width: 100%;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    .controls-info {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: var(--primary-gradient);
      color: white;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(108, 99, 255, 0.4);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(108, 99, 255, 0.6);
    }

    /* Mobiele Touch Besturing */
    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 180px;
      margin-top: 4px;
    }

    .dpad-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: manipulation;
    }

    .dpad-btn:active {
      background: rgba(108, 99, 255, 0.3);
      border-color: var(--border-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="brand-group">
        <a href="https://excuusexpert.github.io/home/" class="brand">
          <i class="fa-solid fa-gamepad brand-icon"></i>
          <span class="brand-title">Snake</span>
        </a>
        <span class="subtitle">Als je je verveelt...</span>
      </div>
      <a href="https://excuusexpert.github.io/home/" class="btn-back">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </header>

    <div class="game-card">
      <div class="score-bar">
        <span>Score: <span id="score" class="score-val">0</span></span>
        <span>Highscore: <span id="highscore" class="highscore-val">0</span></span>
      </div>

      <canvas id="gameCanvas" width="360" height="360"></canvas>

      <button id="startBtn" class="btn-action" onclick="startGame()">
        <i class="fa-solid fa-play"></i> Start Spel
      </button>

      <!-- D-Pad voor mobiel -->
      <div class="mobile-controls">
        <div></div>
        <button class="dpad-btn" onclick="setDirection('UP')"><i class="fa-solid fa-arrow-up"></i></button>
        <div></div>
        <button class="dpad-btn" onclick="setDirection('LEFT')"><i class="fa-solid fa-arrow-left"></i></button>
        <button class="dpad-btn" onclick="setDirection('DOWN')"><i class="fa-solid fa-arrow-down"></i></button>
        <button class="dpad-btn" onclick="setDirection('RIGHT')"><i class="fa-solid fa-arrow-right"></i></button>
      </div>

      <div class="controls-info">Gebruik de pijltjestoetsen of het scherm voor besturing</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const gridSize = 18;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 0;
    let dy = 0;
    let score = 0;
    let highscore = localStorage.getItem('snake_highscore') || 0;
    let gameInterval = null;
    let isRunning = false;

    document.getElementById('highscore').textContent = highscore;

    function startGame() {
      snake = [{ x: 10, y: 10 }];
      dx = 1;
      dy = 0;
      score = 0;
      document.getElementById('score').textContent = score;
      isRunning = true;
      document.getElementById('startBtn').innerHTML = '<i class="fa-solid fa-rotate-right"></i> Herstarten';
      
      generateFood();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 100);
    }

    function gameLoop() {
      moveSnake();
      if (checkGameOver()) {
        clearInterval(gameInterval);
        isRunning = false;
        alert('Game Over! Je score was: ' + score);
        return;
      }
      draw();
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > highscore) {
          highscore = score;
          localStorage.setItem('snake_highscore', highscore);
          document.getElementById('highscore').textContent = highscore;
        }
        generateFood();
      } else {
        snake.pop();
      }
    }

    function checkGameOver() {
      const head = snake[0];
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return true;
      }
      for (let i = 1; i < snake.length; i++) {
        if (snake[i].x === head.x && snake[i].y === head.y) {
          return true;
        }
      }
      return false;
    }

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) generateFood();
      });
    }

    function draw() {
      // Achtergrond leegmaken
      ctx.fillStyle = '#0a0c16';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Eten tekenen (Lichtgevende cirkel)
      ctx.fillStyle = '#00f2fe';
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#00f2fe';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * gridSize, (food.y + 0.5) * gridSize, gridSize / 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake tekenen
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#818cf8' : '#6c63ff';
        ctx.shadowBlur = index === 0 ? 10 : 0;
        ctx.shadowColor = '#818cf8';
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
        ctx.shadowBlur = 0;
      });
    }

    function setDirection(dir) {
      if (!isRunning) return;
      if (dir === 'UP' && dy !== 1) { dx = 0; dy = -1; }
      if (dir === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
      if (dir === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') setDirection('UP');
      if (e.key === 'ArrowDown') setDirection('DOWN');
      if (e.key === 'ArrowLeft') setDirection('LEFT');
      if (e.key === 'ArrowRight') setDirection('RIGHT');
    });

    // Eerste weergave
    draw();
  </script>
</body>
</html>
